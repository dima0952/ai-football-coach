<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Football Coach</title>
<style>
:root { --ink:#f4efe4; --muted:#c9c0ae; --line:rgba(244,239,228,.14); --gold:#e4c98a; }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; }
body { font-family:"Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(#0c1812,#08110d 40%,#102418); }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
.shell { min-height:100vh; display:grid; grid-template-columns:240px 1fr; }
.side { padding:24px 18px; background:rgba(0,0,0,.28); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:22px; }
.brand { display:flex; gap:10px; align-items:center; }
.brand strong { display:block; }
.brand small, .who small, .muted { color:var(--muted); }
.nav { display:grid; gap:6px; }
.nav button { text-align:left; border:0; background:transparent; color:var(--ink); border-radius:12px; padding:11px 12px; }
.nav button.active { background:#f4efe4; color:#142018; }
.who { margin-top:auto; }
.who b { display:block; font-size:22px; font-weight:500; }
main { padding:28px; background:#f4efe4; color:#1b1914; }
main .muted { color:#5e574c; }
.kicker { letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:#6d5420; }
h1, h2 { font-weight:500; letter-spacing:-.03em; }
h1 { font-size:56px; line-height:.9; margin:8px 0 12px; }
h2 { font-size:32px; margin:6px 0 8px; }
.hero { display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; min-height:78vh; }
.sheet { background:#fffaf1; border:1px solid rgba(27,25,20,.12); border-radius:22px; padding:20px; }
.form { display:grid; gap:12px; }
label { display:grid; gap:6px; font-size:13px; color:#5e574c; }
input, select, textarea { background:#fff; border:1px solid rgba(27,25,20,.16); border-radius:12px; padding:12px; color:#1b1914; }
.btn, .btn-ghost { border-radius:999px; padding:12px 16px; border:1px solid transparent; }
.btn { background:var(--gold); color:#1b1710; font-weight:700; }
.btn-ghost { background:transparent; color:#1b1914; border-color:rgba(27,25,20,.2); }
.grid { display:grid; gap:14px; }
.grid-2 { grid-template-columns:1.1fr .9fr; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.score { font-size:76px; line-height:.8; }
.bar { height:8px; background:rgba(27,25,20,.08); border-radius:99px; overflow:hidden; }
.bar span { display:block; height:100%; background:var(--gold); }
.bar.warn span { background:#e07a4c; }
.tag { display:inline-flex; border-radius:999px; padding:5px 9px; font-size:12px; background:rgba(228,201,138,.3); color:#6d5420; }
.tag.bad { background:rgba(224,122,76,.18); color:#9a3d1c; }
.drop { border:1px dashed rgba(109,84,32,.5); border-radius:16px; padding:22px; text-align:center; }
video { width:100%; border-radius:14px; max-height:240px; background:#000; }
.list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.list li { display:flex; justify-content:space-between; gap:12px; padding-bottom:8px; border-bottom:1px solid rgba(27,25,20,.12); }
.week { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.split { display:flex; justify-content:space-between; gap:10px; }
@media (max-width:900px) { .shell, .hero, .grid-2, .week { grid-template-columns:1fr; } .who { margin-top:0; } }
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="brand">
<svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M24 6c2 6 2 10 0 16-6 1-10 4-14 10 6 2 10 2 14-2 4 4 8 4 14 2-4-6-8-9-14-10 2-6 2-10 0-16z" fill="currentColor"/><circle cx="24" cy="24" r="3" fill="#f4efe4"/></svg>
<div><strong>AI Football Coach</strong><small>скаутський кабінет</small></div>
</div>
<nav class="nav" id="nav" hidden>
<button type="button" data-view="home" class="active">Кабінет</button>
<button type="button" data-view="upload">Нове відео</button>
<button type="button" data-view="plan">План</button>
<button type="button" data-view="progress">Прогрес</button>
</nav>
<div class="who" id="who"></div>
</aside>
<main id="view"></main>
</div>
<script>
const WORKER = "https://small-haze-21fc.kontenetdima.workers.dev";
const SKILLS = [["control","Контроль м'яча"],["dribble","Дриблінг"],["shot","Удар"],["position","Позиція"],["decision","Швидкість рішень"],["offball","Гра без м'яча"],["phys","Фізика"]];
const POSITIONS = { GK:"Воротар", CB:"Центральний захисник", FB:"Крайній захисник", DM:"Опорний півзахисник", CM:"Центральний півзахисник", AM:"Атакувальний півзахисник", W:"Вінгер", ST:"Нападник" };
const DRILLS = {
  control:["Перший дотик у квадраті 4×4","Прийом з розворотом під тиском","Жонглювання 2×40"],
  dribble:["Слалом 6 конусів","Фінт і ривок на 8 метрів","1 на 1, максимум 3 дотики"],
  shot:["12 ударів після прийому","Удар слабшою ногою, 8 повторів","Завершення з кута штрафного"],
  position:["Відкривання між лініями","Повернення після втрати","Кут тіла перед прийомом"],
  decision:["3 на 2, максимум 2 дотики","Пас чи удар за 1 секунду","Сканування плечем перед прийомом"],
  offball:["Ривок у зону після пасу","Відкривання на півкорпусу","Пресинг першого пасу, 6 повторів"],
  phys:["6×20 м старт з місця","15 секунд робота / 20 відпочинок","Драбинка і ривок"]
};
const store = {
  load() { try { return JSON.parse(localStorage.getItem("afc") || "null"); } catch (e) { return null; } },
  save(data) { localStorage.setItem("afc", JSON.stringify(data)); }
};
let state = store.load() || { player:null, sessions:[] };
const view = document.querySelector("#view");
const nav = document.querySelector("#nav");
const who = document.querySelector("#who");
nav.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  show(btn.dataset.view);
});
function show(name) {
  [...nav.children].forEach((b) => b.classList.toggle("active", b.dataset.view === name));
  nav.hidden = !state.player;
  who.innerHTML = state.player ? "<small>" + POSITIONS[state.player.position] + "</small><b>" + escapeHtml(state.player.name) + "</b>" : "";
  const screens = { home, upload, plan, progress, start };
  (screens[name] || start)();
}
function start() {
  nav.hidden = true;
  who.innerHTML = "";
  view.innerHTML = '<section class="hero"><div><div class="kicker">Кабінет гравця</div><h1>Твоє поле.</h1><p class="muted">Відео, розбір і план на тиждень. Ключ не потрібен.</p></div><form class="sheet form" id="join"><div class="kicker">Профіль</div><label>Ім’я<input name="name" required placeholder="Твоє ім’я" /></label><label>Позиція<select name="position">' + Object.entries(POSITIONS).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join("") + '</select></label><label>Вік<input name="age" type="number" min="8" max="45" value="16" /></label><label>Робоча нога<select name="foot"><option>Права</option><option>Ліва</option><option>Обидві</option></select></label><button class="btn" type="submit">Увійти в кабінет</button></form></section>';
  document.querySelector("#join").onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    state.player = { name:f.get("name").trim(), position:f.get("position"), age:Number(f.get("age")), foot:f.get("foot") };
    store.save(state);
    show("home");
  };
}
function home() {
  const last = state.sessions[0];
  view.innerHTML = '<section class="sheet"><div class="kicker">' + POSITIONS[state.player.position] + " · " + state.player.foot + ' нога</div><h2>' + escapeHtml(state.player.name) + '</h2><p class="muted">' + state.sessions.length + ' відео в кабінеті.</p><div class="row"><button class="btn" onclick="show(\'upload\')">Завантажити відео</button><button class="btn-ghost" onclick="resetAll()">Скинути</button></div></section><section class="grid grid-2" style="margin-top:14px"><article class="sheet">' + (last ? '<div class="kicker">Останній розбір</div><div class="score">'+last.overall+'</div><p>'+escapeHtml(last.title)+'</p>' : '<h2>Поле пусте</h2><p class="muted">Перше відео відкриє оцінки.</p>') + '</article><article class="sheet"><div class="kicker">На чому стояти</div>' + (last ? skillBars(last.scores) : '<p class="muted">Після ролика тут будуть оцінки.</p>') + '</article></section>';
}
function upload() {
  view.innerHTML = '<section class="grid grid-2"><article class="sheet"><div class="kicker">Нове відео</div><h2>Кинь ролик</h2><video id="preview" hidden controls></video></article><form class="sheet form" id="up"><div class="drop">Вибери відео<br><input id="file" type="file" accept="video/*" required style="margin-top:10px" /></div><label>Назва<input name="title" required /></label><label>Тип<select name="kind"><option>Тренування</option><option>Матч</option><option>Окремий навик</option></select></label><label>Що знято<textarea name="note" rows="3"></textarea></label><button class="btn" type="submit">Розібрати</button><p id="status" class="muted"></p></form></section>';
  const file = document.querySelector("#file");
  const preview = document.querySelector("#preview");
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    preview.hidden = false;
    preview.src = URL.createObjectURL(f);
    if (!document.querySelector("[name=title]").value) document.querySelector("[name=title]").value = f.name.replace(/\.[^.]+$/, "");
  };
  document.querySelector("#up").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const status = document.querySelector("#status");
    status.textContent = "Беру кадри...";
    try {
      const frames = await grabFrames(preview, 3);
      status.textContent = "Дивлюсь кадри...";
      const session = await askCoach(frames, { title:f.get("title"), kind:f.get("kind"), note:f.get("note"), position: POSITIONS[state.player.position] });
      state.sessions.unshift(session);
      store.save(state);
      report(session);
    } catch (err) {
      status.textContent = "Не вийшло: " + err.message;
    }
  };
}
function grabFrames(video, count) {
  return new Promise((resolve, reject) => {
    const take = () => {
      if (!video.videoWidth) { reject(new Error("відео ще не провантажилось")); return; }
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = Math.max(270, Math.round(video.videoHeight * (480 / video.videoWidth)));
      const ctx = canvas.getContext("2d");
      const frames = [];
      let i = 0;
      const next = () => {
        if (i >= count) return resolve(frames);
        video.currentTime = Math.max(0.2, video.duration * (i + 1) / (count + 1));
        video.onseeked = () => {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          frames.push(canvas.toDataURL("image/jpeg", 0.7).split(",")[1]);
          i += 1;
          next();
        };
      };
      next();
    };
    if (video.readyState >= 1) take();
    else video.onloadeddata = take;
  });
}
async function askCoach(frames, info) {
  const prompt = "Ти футбольний тренер. Кадри ролика. Позиція: " + info.position + ". Тип: " + info.kind + ". Нотатка: " + (info.note || "немає") + ". Поверни тільки JSON: {\"overall\":72,\"scores\":{\"control\":70,\"dribble\":66,\"shot\":60,\"position\":74,\"decision\":68,\"offball\":64,\"phys\":71},\"strong\":[\"control\",\"position\"],\"weak\":[\"shot\",\"decision\"],\"moments\":[{\"t\":\"00:04\",\"text\":\"що видно\"}]} Текст українською.";
  const res = await fetch(WORKER, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ contents:[{ parts:[{ text:prompt }, ...frames.map((data) => ({ inlineData:{ mimeType:"image/jpeg", data } }))] }] })
  });
  if (!res.ok) throw new Error("розбір не пройшов (" + res.status + ")");
  const data = await res.json();
  const text = (data.candidates && data.candidates[0] && data.candidates[0].content.parts || []).map((p) => p.text || "").join("\n");
  const json = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
  return { id:Date.now(), title:info.title, kind:info.kind, note:info.note, date:new Date().toLocaleDateString("uk-UA"), scores:json.scores, strong:json.strong, weak:json.weak, overall:json.overall, moments:json.moments || [] };
}
function report(s) {
  view.innerHTML = '<section class="sheet" style="margin-bottom:14px"><div class="kicker">' + s.date + " · " + s.kind + '</div><div class="score">' + s.overall + '</div><h2>' + escapeHtml(s.title) + '</h2></section><section class="grid grid-2"><article class="sheet">' + skillBars(s.scores) + '</article><article class="sheet"><h2>Сильні</h2>' + s.strong.map((k) => '<p><span class="tag">' + label(k) + " · " + s.scores[k] + '</span></p>').join("") + '<h2>Слабкі</h2>' + s.weak.map((k) => '<p><span class="tag bad">' + label(k) + " · " + s.scores[k] + '</span></p>').join("") + '<ul class="list">' + (s.moments || []).map((m) => '<li><b>' + m.t + '</b><span>' + escapeHtml(m.text) + '</span></li>').join("") + '</ul><div class="row"><button class="btn" onclick="show(\'plan\')">План на тиждень</button></div></article></section>';
}
function skillBars(scores) {
  return SKILLS.map(([k, name]) => '<div class="split"><span>' + name + '</span><b>' + scores[k] + '</b></div><div class="bar' + (scores[k] < 60 ? " warn" : "") + '"><span style="width:' + scores[k] + '%"></span></div>').join("");
}
function plan() {
  const last = state.sessions[0];
  if (!last) { view.innerHTML = '<section class="sheet"><h2>Ще немає розбору</h2></section>'; return; }
  const days = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const focus = last.weak.concat(last.strong);
  view.innerHTML = '<section class="sheet"><div class="kicker">Тиждень</div><h2>Під ' + last.weak.map(label).join(" і ") + '</h2><div class="week">' + days.map((d, i) => '<article class="sheet"><b>' + d + '</b><p>' + (i === 6 ? "Вихідний" : DRILLS[focus[i % focus.length]][i % 3]) + '</p></article>').join("") + '</div></section>';
}
function progress() {
  if (state.sessions.length < 2) { view.innerHTML = '<section class="sheet"><h2>Потрібні два відео</h2><p class="muted">Завантаж ще один ролик.</p></section>'; return; }
  const a = state.sessions[0], b = state.sessions[1];
  view.innerHTML = '<section class="sheet"><div class="kicker">Порівняння</div><div class="score">' + (a.overall - b.overall >= 0 ? "+" : "") + (a.overall - b.overall) + '</div><p>' + escapeHtml(a.title) + " проти " + escapeHtml(b.title) + '</p></section>';
}
function label(key) { const found = SKILLS.find(([k]) => k === key); return found ? found[1] : key; }
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, String.fromCharCode(38, 97, 109, 112, 59))
    .replace(/</g, String.fromCharCode(38, 108, 116, 59))
    .replace(/>/g, String.fromCharCode(38, 103, 116, 59))
    .replace(/"/g, String.fromCharCode(38, 113, 117, 111, 116, 59));
}
function resetAll() { localStorage.removeItem("afc"); state = { player:null, sessions:[] }; show("start"); }
window.show = show;
window.resetAll = resetAll;
show(state.player ? "home" : "start");
</script>
</body>
</html>
